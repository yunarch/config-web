name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CI: true
  DO_NOT_TRACK: 1
  HUSKY: 0

permissions: {}

jobs:
  lint:
    name: Code linting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔍 Lint files
        run: bun run lint
  unit_test:
    name: Unit testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Test files
        run: bun run tests
  build_test:
    name: Build testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🔧 Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🧪 Test Build
        run: bun run build
