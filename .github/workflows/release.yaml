name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      move_tag:
        description: 'Move tag to latest commit if behind'
        type: boolean
        required: false
        default: false

env:
  CI: true
  DO_NOT_TRACK: 1
  HUSKY: 0

permissions: {}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: ⚙️ Setup Node 24 (Temporary solution until Bun publish supports OIDC)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: 🔧 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          no-cache: true
      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile
      - name: 🔍 Lint files
        run: bun run lint
      - name: 🔨 Build files
        run: bun run build
      - name: 🧪 Test distribution
        run: bun run tests
        env:
          TEST_DIST: true
      - name: 🚀 Publish
        run: npm publish
      - name: 🔖 Move tag to latest commit
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.move_tag == 'true'
        run: |
          git config user.name "{{ github.actor }}"
          git config user.email "{{ github.actor }}@users.noreply.github.com"
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          HEAD_COMMIT=$(git rev-parse HEAD)
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-parse "$TAG_NAME")
            if git merge-base --is-ancestor "$TAG_COMMIT" "$HEAD_COMMIT" && [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG_NAME is behind HEAD. Moving from $TAG_COMMIT to $HEAD_COMMIT"
              git tag -d "$TAG_NAME"
              git tag "$TAG_NAME" "$HEAD_COMMIT"
              git push origin "$TAG_NAME" --force
            fi
          fi
      - name: 📝 Generate release notes
        run: bunx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
