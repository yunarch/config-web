name: GitHub Secret Scanning with TruffleHog 🕵🏽‍♂️

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

jobs:
  TruffleHog:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 🕵🏽‍♂️ Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9
        with:
          extra_args: --results=verified,unknown
