name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['**']
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  zizmor:
    name: GitHub Actions Analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required to upload SARIF results to the Security tab (only used on push to main).
      contents: read # Only needed for private repos. Needed to clone the repo.
      actions: read # Only needed for private repos. Needed for the SARIF upload to read workflow run info.
    steps:
      - name: 📁 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 🌈 Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e
        with:
          # On push to main, upload results to the Security tab.
          # On pull requests, print results to the console so the job actually fails on findings.
          advanced-security: ${{ github.event_name == 'push' }}
          # Findings below this severity are ignored: unknown | informational | low | medium | high
          min-severity: low
